<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Notes App</title>
    <!-- Google Font for crisp, modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Centered Card Container */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .card h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3182ce;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* List Styling */
        .notes-list {
            list-style: none;
            text-align: left;
        }

        .note-item {
            background: #f7fafc;
            padding: 14px 16px;
            border: 1px solid #edf2f7;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 15px;
            color: #2d3748;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .note-item:last-child {
            margin-bottom: 0;
        }

        /* Footer Badge */
        .footer-badge {
            margin-top: 24px;
            display: inline-block;
            padding: 4px 12px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📝 DevOps Quick Notes</h1>
        <p class="subtitle">Deployed via Kubernetes & GitHub Actions</p>

        <form action="/add" method="POST" class="form-group">
            <input type="text" name="note" placeholder="Write a new note..." required autocomplete="off">
            <button type="submit">Add Note</button>
        </form>

        <ul class="notes-list">
            {% for note in notes %}
                <li class="note-item">
                    <span>{{ note }}</span>
                </li>
            {% else %}
                <li class="note-item" style="color: #a0aec0; justify-content: center;">
                    No notes yet. Add one above!
                </li>
            {% endfor %}
        </ul>

        <div class="footer-badge">
            🚀 Kubernetes Multi-Pod Architecture
        </div>
    </div>

</body>
</html>
